# Production-oriented compose. Requires a populated `.env` with COOKIE_SECURE=true,
# ALLOW_* flags false, and PostgreSQL + Redis URLs. Do not use demo seed.
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [wealthagent]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [wealthagent]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
      ALLOW_SQLITE: "false"
      ALLOW_MEMORY_CACHE: "false"
      ALLOW_DEMO_SEED: "false"
      ALLOW_CREATE_ALL: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 8
    volumes:
      - upload-data:/app/uploads
    restart: unless-stopped
    networks: [wealthagent]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
      ALLOW_SQLITE: "false"
      ALLOW_MEMORY_CACHE: "false"
      ALLOW_DEMO_SEED: "false"
      ALLOW_CREATE_ALL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [wealthagent]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    networks: [wealthagent]

networks:
  wealthagent:
    driver: bridge

volumes:
  postgres-data:
  upload-data:
